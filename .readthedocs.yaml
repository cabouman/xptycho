# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  jobs:
    pre_install:
      # Install the CPU-only torch wheel first.  Without this, pip resolves
      # torch from PyPI, which on Linux is the CUDA build with several
      # gigabytes of NVIDIA wheels, more than the Read the Docs build allows.
      # The docs only import the package, so the CPU wheel is enough.
      - pip install --upgrade pip
      - pip install torch --index-url https://download.pytorch.org/whl/cpu

python:
   install:
   - method: pip
     path: .
     extra_requirements:
       - docs

sphinx:
   configuration: docs/source/conf.py
